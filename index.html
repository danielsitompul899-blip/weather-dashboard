<form id="searchForm">
  <input
    id="cityInput"
    type="search"
    placeholder="Contoh: Jakarta"
    required>

  <button type="submit">
    Cari Cuaca
  </button>
</form>

<div id="statusMessage">
  Masukkan nama kota untuk melihat data cuaca.
</div>

<section id="weatherDashboard" hidden>
  <h2 id="locationName">-</h2>
  <p id="weatherDescription">-</p>
  <strong id="temperature">--°C</strong>
  <p id="humidity">Kelembapan: --%</p>
  <p id="windSpeed">Angin: -- km/j</p>
</section>
