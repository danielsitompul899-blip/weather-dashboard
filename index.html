<section class="weather-card">
  <div class="location-heading">
    <div>
      <p class="eyebrow">Lokasi Saat Ini</p>
      <h2 id="locationName">Surabaya</h2>
      <p id="locationDate">-</p>
    </div>

    <div class="weather-icon" id="weatherIcon">
      ☀️
    </div>
  </div>

  <div class="temperature-box">
    <strong id="temperature">--°C</strong>
    <span id="weatherDescription">-</span>
  </div>

  <div class="weather-details">
    <div>
      <small>Kelembapan</small>
      <strong id="humidity">--%</strong>
    </div>

    <div>
      <small>Kecepatan Angin</small>
      <strong id="windSpeed">-- km/j</strong>
    </div>
  </div>
</section>
